name: worldfriends
description: WorldFriends - private beta messenger for friends and family.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8

  # Networking / state
  http: 1.2.2
  web_socket_channel: 3.0.1
  provider: 6.1.2
  shared_preferences: 2.3.2
  flutter_secure_storage: 9.2.2

  # Utilities
  intl: 0.19.0
  uuid: 4.5.0
  path_provider: 2.1.4
  path: 1.9.0
  device_info_plus: 11.0.0
  package_info_plus: 8.0.2
  connectivity_plus: 6.0.5

  # Media
  image_picker: 1.1.2
  file_picker: 8.1.4
  record: 5.1.2
  just_audio: 0.9.40
  video_player: 2.9.2
  cached_network_image: 3.4.1
  open_filex: 4.5.0
  permission_handler: 11.3.1

  # Calls
  flutter_webrtc: 0.11.7

  # Firebase (optional at runtime: the app degrades gracefully without config)
  firebase_core: 3.6.0
  firebase_messaging: 15.1.5
  firebase_crashlytics: 4.1.3
  firebase_analytics: 11.3.3
  google_sign_in: 6.2.1

dev_dependencies:
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
